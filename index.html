<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Tournament</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      /* min-height: 100vh; */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
    }

    .screen.active {
      display: block;
    }

    /* ── Setup ── */
    #setup {
      text-align: center;
    }

    #setup h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    #setup p {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    #setup button {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ── Tournament ── */
    #tournament {
      text-align: center;
    }

    #progress {
      color: #777;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card {
      cursor: pointer;
      border: 2px solid #333;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.15s;
      background: #1a1a1a;
    }

    .card:active {
      border-color: #fff;
    }

    .card img {
      display: block;
      width: 160px;
      height: 160px;
      object-fit: cover;
      object-position: center top;
      margin: 0 auto;
    }

    .card .label {
      padding: 0.6rem;
      color: #ccc;
      font-size: 1rem;
      font-weight: 600;
    }

    .vs {
      text-align: center;
      font-size: 1rem;
      font-weight: 800;
      color: #9a9a9a;
    }

    /* ── Results ── */
    #results h1 {
      font-size: 1.6rem;
      margin-bottom: 0.3rem;
    }

    #results>p {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #222;
    }

    .rank {
      font-size: 1.2rem;
      font-weight: 800;
      min-width: 2.2rem;
      text-align: right;
      color: #555;
    }

    .rank.gold {
      color: #f5c518;
    }

    .rank.silver {
      color: #bbb;
    }

    .rank.bronze {
      color: #cd7f32;
    }

    .result-item img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .result-item .name {
      font-size: 0.95rem;
      color: #ccc;
      font-weight: 600;
    }

    #restart {
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.75rem;
      font-size: 0.95rem;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Setup -->
  <div id="setup" class="screen active">
    <h1>📸 Photo Tournament</h1>
    <p>Pick your favourite — one match at a time.</p>
    <button onclick="startTournament()">Let's Go</button>
  </div>

  <!-- Tournament -->
  <div id="tournament" class="screen">
    <div id="progress"></div>
    <div class="cards">
      <div class="card" onclick="pick('a')">
        <img id="imgA" src="" alt="" />
        <div class="label" id="labelA"></div>
      </div>
      <div class="vs">VS</div>
      <div class="card" onclick="pick('b')">
        <img id="imgB" src="" alt="" />
        <div class="label" id="labelB"></div>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="screen">
    <h1>🏆 Final Ranking</h1>
    <p>Best to worst — based on your picks.</p>
    <div id="rankList"></div>
    <button id="restart" onclick="restart()">↩ Play Again</button>
  </div>

  <script>

    // ============================================================
    //  ADD YOUR PHOTOS HERE
    //  { name: "Display Name", url: "https://..." }
    // ============================================================
    const PHOTOS = [
      { name: "Salman Khan", url: "https://media5.bollywoodhungama.in/wp-content/uploads/2016/03/51206028.jpg" },
      { name: "Zayne Malik", url: "https://www.datocms-assets.com/39109/1711030415-cover_zayn_usa_shop.jpg?auto=format%2Ccompress&cs=srgb" },
      { name: "Maluma", url: "https://media.mdzol.com/p/4df22154219982c3ac4b851d4d4b5c0e/adjuntos/373/imagenes/000/861/0000861268/1200x675/smart/maluma-foto-marca.jpg" },
      { name: "Leo Rahim", url: "https://leo-portfolio-2023.vercel.app/photos/me.jpg" },
      { name: "Avan Jogia", url: "https://tse2.mm.bing.net/th/id/OIP.w7c67kI1B3jGEnpJmBe9iAHaKR?pid=ImgDet&w=181&h=251&c=7&dpr=1.5&o=7&rm=3" },
      { name: "Joe Jonas", url: "https://www.instyle.com/thmb/S1GchQllAEj7p6zWmoyoMc4Xqkg=/750x0/filters:no_upscale():max_bytes(150000):strip_icc():format(webp)/JoeJonasLead-83e4672b0ca14857a8d085d32550e830.jpg" },
    ];
    // ============================================================

    // ── Helpers ───────────────────────────────────────────────────

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function estimateTotal(n) {
      return n <= 1 ? 0 : Math.ceil(n * Math.log2(n));
    }

    // ── State ─────────────────────────────────────────────────────

    let resolvePick = null;
    let matchNum = 0;
    let totalEst = 0;

    // ── Merge sort (user-driven) ──────────────────────────────────

    async function mergeSort(arr) {
      if (arr.length <= 1) return arr;
      const mid = Math.floor(arr.length / 2);
      const left = await mergeSort(arr.slice(0, mid));
      const right = await mergeSort(arr.slice(mid));
      return mergeParts(left, right);
    }

    async function mergeParts(left, right) {
      const result = [];
      let i = 0, j = 0;
      while (i < left.length && j < right.length) {
        const winner = await askUser(left[i], right[j]);
        if (winner === left[i]) result.push(left[i++]);
        else result.push(right[j++]);
      }
      return [...result, ...left.slice(i), ...right.slice(j)];
    }

    function askUser(a, b) {
      matchNum++;
      document.getElementById('progress').textContent =
        `Match ${matchNum} of ~${totalEst} — tap the photo you prefer`;

      document.getElementById('imgA').src = a.url;
      document.getElementById('labelA').textContent = a.name;
      document.getElementById('imgB').src = b.url;
      document.getElementById('labelB').textContent = b.name;

      return new Promise(resolve => {
        resolvePick = (choice) => {
          resolvePick = null;
          resolve(choice === 'a' ? a : b);
        };
      });
    }

    // ── Controls ──────────────────────────────────────────────────

    function pick(choice) {
      if (resolvePick) resolvePick(choice);
    }

    function startTournament() {
      totalEst = estimateTotal(PHOTOS.length);
      matchNum = 0;
      show('tournament');
      // shuffle so order isn't predictable
      const shuffled = [...PHOTOS].sort(() => Math.random() - 0.5);
      mergeSort(shuffled).then(showResults);
    }

    function showResults(ranked) {
      const list = document.getElementById('rankList');
      list.innerHTML = '';
      ranked.forEach((p, i) => {
        const rank = i + 1;
        const cls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
        const item = document.createElement('div');
        item.className = 'result-item';
        item.innerHTML = `
          <div class="rank ${cls}">#${rank}</div>
          <img src="${p.url}" alt="${p.name}" />
          <div class="name">${p.name}</div>
        `;
        list.appendChild(item);
      });
      show('results');
    }

    function restart() {
      resolvePick = null;
      show('setup');
    }

  </script>
</body>

</html>
